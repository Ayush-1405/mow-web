name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "mood-of-wood-staff-pilot/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "mood-of-wood-staff-pilot/frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mood-of-wood-staff-pilot/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mood-of-wood-staff-pilot/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
